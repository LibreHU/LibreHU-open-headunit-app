name: LibreHU regex check

# LibreHU fork: compiles every regular expression of the app (and LibreHU Helper's) with the regex engine (ICU) of each
# Android version the app runs on (minSdk 16): a pattern the engine refuses stops the app, as LibreHU Helper's MAC
# pattern (« [: » then « :] ») on every Android. tools/librehu/RegexCheck.java, run through app_process on emulators.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, target: default, arch: x86 }
          - { api: 19, target: default, arch: x86 }
          - { api: 21, target: default, arch: x86_64 }
          - { api: 23, target: default, arch: x86_64 }
          - { api: 26, target: default, arch: x86_64 }
          - { api: 28, target: default, arch: x86_64 }
          - { api: 29, target: default, arch: x86_64 }
          - { api: 30, target: google_apis, arch: x86_64 }
          - { api: 31, target: google_apis, arch: x86_64 }
          - { api: 33, target: google_apis, arch: x86_64 }
          - { api: 34, target: google_apis, arch: x86_64 }
          - { api: 35, target: google_apis, arch: x86_64 }
    env:
      API: ${{ matrix.api }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the check (dex for Android 4.1 and later)
        run: |
          mkdir -p out
          javac --release 8 -d out tools/librehu/RegexCheck.java
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/d8" --min-api 16 --output out out/RegexCheck.class
          ls -l out

      - name: Run on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: sh tools/librehu/regex_check.sh out/classes.dex
