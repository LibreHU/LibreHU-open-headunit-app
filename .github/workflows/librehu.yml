name: LibreHU build

# LibreHU fork: the github flavour in release, signed with the LibreHU key, published as the rolling prerelease of the
# branch (LibreHU Apps reads its release.txt) and as a numbered build.
on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: librehu-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install pinned NDK, CMake and build tools
        run: |
          for attempt in 1 2 3; do
            sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" "build-tools;36.0.0" && exit 0
            sleep 15
          done
          exit 1

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble github release APK
        env:
          LIBREHU_KEYSTORE_BASE64: ${{ secrets.LIBREHU_KEYSTORE_BASE64 || secrets.LIBREHU_KEYSTORE_B64 }}
          LIBREHU_KEYSTORE_PASSWORD: ${{ secrets.LIBREHU_KEYSTORE_PASSWORD }}
          LIBREHU_KEY_PASSWORD: ${{ secrets.LIBREHU_KEY_PASSWORD }}
        run: |
          # The LibreHU key: the LIBREHU_KEYSTORE_B64 secret when set, else the one of LibreHU-service.
          if [ -n "$LIBREHU_KEYSTORE_BASE64" ]; then
            echo "$LIBREHU_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/librehu.jks"
          else
            # Without the secret: the shared LibreHU key of LibreHU-service (keystore/librehu.jks, the one every
            # LibreHU app is signed with); *.jks files are ignored by git in this repository.
            curl -fsSL -o "$RUNNER_TEMP/librehu.jks" \
              https://raw.githubusercontent.com/LibreHU/LibreHU-service/main/keystore/librehu.jks
          fi
          export LIBREHU_KEYSTORE="$RUNNER_TEMP/librehu.jks"
          unset LIBREHU_KEYSTORE_BASE64
          [ -n "$LIBREHU_KEYSTORE_PASSWORD" ] || unset LIBREHU_KEYSTORE_PASSWORD
          [ -n "$LIBREHU_KEY_PASSWORD" ] || unset LIBREHU_KEY_PASSWORD
          ./gradlew :app:assembleGithubRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: open-headunit-librehu
          path: app/build/outputs/apk/github/release/*.apk
          if-no-files-found: error

      - name: Rolling release of the branch (LibreHU OTA)
        # Also when started by hand (Actions tab): a [skip ci] head commit leaves the branch's code unpublished otherwise.
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          APP: OpenHeadunit-LibreHU
        run: |
          SLUG="${BRANCH//\//-}"
          TAG="latest-$SLUG"
          OUT="$APP-$SLUG.apk"
          cp "$(ls app/build/outputs/apk/github/release/*.apk | head -n1)" "$OUT"
          # An unsigned APK does not install ("Failed to collect certificates"): never publish one.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -n1)
          "$APKSIGNER" verify --print-certs "$OUT" || { echo "::error::$OUT is not signed (LIBREHU_KEYSTORE_BASE64 secret missing?)"; exit 1; }
          # versionCode (upstream's + number of commits, see build.gradle.kts) and versionName of the APK itself, the commit.
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -n1)
          CODE=$("$AAPT" dump badging "$OUT" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$("$AAPT" dump badging "$OUT" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          # SHA-256 of the APK: LibreHU Apps checks the download against it.
          SHA=$(sha256sum "$OUT" | cut -d' ' -f1)
          printf 'versionCode=%s\nversionName=%s\nbranch=%s\ncommit=%s\nsha256=%s\n\n%s\n' \
            "$CODE" "$NAME" "$BRANCH" "$GITHUB_SHA" "$SHA" "$(git log -1 --pretty=%s)" > notes.txt
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$APP $NAME ($BRANCH)" --notes-file notes.txt --prerelease
          else
            gh release create "$TAG" --title "$APP $NAME ($BRANCH)" --notes-file notes.txt --prerelease --verify-tag
          fi
          # The same notes with the APK name and size, as a file of the release: LibreHU Apps reads it as a download,
          # which does not count against the GitHub API limit (60 requests per hour without an account).
          { printf 'apk=%s\nsize=%s\ndate=%s\n' "$OUT" "$(stat -c %s "$OUT")" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; cat notes.txt; } > release.txt
          gh release upload "$TAG" "$OUT" release.txt --clobber
          BTAG="build-$SLUG-$(git rev-list --count HEAD)"
          if ! gh release view "$BTAG" >/dev/null 2>&1; then
            git tag -f "$BTAG" "$GITHUB_SHA"
            git push -f origin "refs/tags/$BTAG"
            gh release create "$BTAG" "$OUT" --title "$APP $NAME ($BRANCH)" --notes-file notes.txt --prerelease --verify-tag
          fi
          gh release list --limit 300 --json tagName --jq ".[].tagName | select(startswith(\"build-$SLUG-\"))" \
            | awk -F- '{ print $NF, $0 }' | sort -n | head -n -15 | cut -d' ' -f2 \
            | while read -r old; do gh release delete "$old" --cleanup-tag -y; done
